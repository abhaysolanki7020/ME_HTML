<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Biodata</legend>
        <form action="#">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name">
            <br><br>
            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass">
            <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel" >
            <br><br>
            <label for="email">Email:</label> 
            <input type="email" name="email" id="email" placeholder="Enter Your Email">
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" name="dob" id="dob"><br><br>
            <label for="add">Address:</label>
            <textarea name="add" id="add"></textarea><br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="Male" id="gender"><label for="gender">Male</label>
            <input type="radio" name="Female" id="gender"><label for="gender">Female</label>
            <br><br>
            <label for="hobb">Hobby:</label>
            <input type="checkbox" name="hobb1" id="hobb1" id="hobb1"><label for="hobb1">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb2"><label for="hobb2">Football</label>
            <br><br>
            <label for="lang">Select one programming language:</label>
            <select name="lang" id="lang">
                    <option vaule="Select">Select</option>
                <option value="C">C</option>
                <option value="Java">Java</option>
                <option value="C++">C++</option>
                <option value="JavaScript">JavaScript</option>
            </select>
        </form>
    </fieldset>

</body>
</html>
